<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ARIA — Voice Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,300;7..72,400&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/console.css" />
</head>
<body class="console-page">

<header class="app-header">
  <div class="brand">
    <div class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">ARIA</span>
      <span class="brand-tag">Voice console</span>
    </div>
  </div>
  <div class="header-actions">
    <div class="auth-chip" id="auth-chip">
      <span class="auth-chip-dot" aria-hidden="true"></span>
      <span id="auth-user"></span>
    </div>
    <span class="session-timer" id="session-timer" aria-live="polite"></span>
    <div class="status-pill" role="status" aria-live="polite">
      <span id="status-dot" class="status-dot disconnected"></span>
      <span id="status-label">offline</span>
    </div>
    <button class="btn-ghost" type="button" onclick="logout()">Sign out</button>
  </div>
</header>

<div id="error-banner" class="error-banner" role="alert">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>
  <span id="error-text"></span>
</div>

<section class="session-bar" aria-label="Session controls">
  <div class="session-field">
    <label for="user-id">User</label>
    <input id="user-id" type="text" readonly aria-readonly="true" />
  </div>
  <div class="session-field">
    <label for="agent-id">Agent</label>
    <select id="agent-id" aria-label="Agent">
      <option value="wwts">wwts</option>
      <option value="agent_one">agent_one</option>
      <option value="l1_support">l1_support</option>
    </select>
  </div>
  <div class="session-divider" aria-hidden="true"></div>
  <button id="btn-start" class="btn-primary" type="button" onclick="startCall()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8" y1="23" x2="16" y2="23"/>
    </svg>
    Start call
  </button>
  <button id="btn-stop" class="btn-danger-ghost" type="button" onclick="stopCall()">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
    End call
  </button>
  <button id="btn-mute" class="btn-ghost" type="button" onclick="toggleMute()" title="Mute microphone">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
    </svg>
    Mute
  </button>
  <span class="session-meta" id="session-info"></span>
</section>

<main class="app-main">
  <section class="conversation-pane">
    <div id="voice-strip" class="voice-strip">
      <span class="vs-label" id="vs-label">Listening</span>
      <canvas id="viz-canvas" width="100" height="28" aria-hidden="true"></canvas>
      <div class="ai-viz" aria-hidden="true">
        <div class="ai-bar"></div><div class="ai-bar"></div><div class="ai-bar"></div><div class="ai-bar"></div>
        <div class="ai-bar"></div><div class="ai-bar"></div><div class="ai-bar"></div><div class="ai-bar"></div>
      </div>
      <div class="vs-dots" aria-hidden="true">
        <div class="vs-dot"></div><div class="vs-dot"></div><div class="vs-dot"></div>
      </div>
    </div>

    <div class="transcript-wrap">
      <div class="transcript-header">
        <h2>Conversation</h2>
        <span id="msg-count"></span>
      </div>
      <div id="transcript" aria-live="polite">
        <div class="empty-state" id="empty-state">
          <div class="empty-orb" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            </svg>
          </div>
          <h3>Ready when you are</h3>
          <p>Choose an agent and start a call. Your microphone will connect to a realtime voice session with live transcription.</p>
          <p class="empty-hint">Press Start call · or type below once connected</p>
        </div>
      </div>
    </div>
  </section>

  <aside id="tool-panel" class="tool-panel" aria-label="Tool activity">
    <div class="tool-panel-header">
      <h3>Tool calls</h3>
      <span id="tool-badge" class="tool-badge">0</span>
    </div>
    <div id="tool-entries"></div>
  </aside>
</main>

<button type="button" id="tool-toggle-fab" class="tool-toggle-fab" onclick="toggleToolPanel()" title="Tool activity" aria-expanded="false">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
  </svg>
</button>

<footer class="composer">
  <label for="text-input-field" class="sr-only">Message</label>
  <input id="text-input-field" type="text" placeholder="Type a message or field value…" disabled />
  <button id="btn-send-text" class="btn-send" type="button" onclick="sendTextMessage()" disabled>Send</button>
</footer>

<audio id="remote-audio" autoplay playsinline></audio>

<script src="/static/auth.js"></script>
<script src="/static/js/console.js"></script>
</body>
</html>
