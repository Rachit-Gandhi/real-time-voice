<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — ARIA Voice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=IBM+Plex+Mono:wght@400;500&family=Literata:opsz,wght@7..72,300;7..72,400&family=Syne:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/design-system.css" />
  <link rel="stylesheet" href="/static/css/base.css" />
  <link rel="stylesheet" href="/static/css/login.css" />
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-panel">
      <div class="login-brand">
        <div class="login-brand-mark">
          <div class="login-brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </div>
        </div>
        <h1>
          <span>ARIA</span>
          Voice Agent
        </h1>
        <p>Sign in with your Worldwide TechServices credentials to start a secure realtime voice session.</p>
      </div>

      <form id="login-form" class="login-form" autocomplete="on">
        <div class="field">
          <label for="user-id">User ID</label>
          <input id="user-id" name="user_id" type="text" autocomplete="username" required placeholder="Your user ID" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </div>
        <div id="error-msg" class="login-error" role="alert"></div>
        <button class="btn-primary btn-login-submit" id="btn-login" type="submit">Sign in</button>
      </form>

      <div class="login-footer">
        <span class="login-version">WWTS · v7.19</span>
      </div>
    </div>

    <aside class="login-visual" aria-hidden="true">
      <div class="login-visual-bg"></div>
      <div class="login-visual-caption">
        <strong>Secure access</strong>
        <p>Enterprise voice agents with realtime transcription and tool orchestration.</p>
      </div>
    </aside>
  </div>

  <script src="/static/auth.js"></script>
  <script>
    'use strict';

    if (WwtsAuth.getAuthContext()) {
      window.location.replace('/console');
    }

    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error-msg');
    const btnLogin = document.getElementById('btn-login');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.add('visible');
    }

    function clearError() {
      errorEl.textContent = '';
      errorEl.classList.remove('visible');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      btnLogin.disabled = true;
      btnLogin.classList.add('loading');
      btnLogin.textContent = 'Signing in…';

      try {
        const resp = await fetch('/gtaccess/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            user_id: document.getElementById('user-id').value.trim(),
            password: document.getElementById('password').value,
          }),
        });

        const body = await resp.json().catch(() => ({}));

        if (!resp.ok) {
          const detail = body.detail;
          const msg = typeof detail === 'string'
            ? detail
            : Array.isArray(detail)
              ? detail.map(d => d.msg || d).join(', ')
              : `Login failed (HTTP ${resp.status})`;
          throw new Error(msg);
        }

        if (!body.success || body.rc !== 0) {
          throw new Error(body.result_msg || `Login failed (rc=${body.rc})`);
        }

        WwtsAuth.setAuthContext(WwtsAuth.parseLoginResponse(body));
        window.location.replace('/console');
      } catch (err) {
        showError(err.message || 'Login failed');
      } finally {
        btnLogin.disabled = false;
        btnLogin.classList.remove('loading');
        btnLogin.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
